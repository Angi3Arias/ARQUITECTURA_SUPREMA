<text x="82" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="bold" >Atencion: Diferencia entre Proteus (COMPIM) y Protoboard Fisico (USB-TTL)</text>
<text x="84" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• En PROTEUS (COMPIM): los pines van DIRECTOS -> RC6/TX (Pin 25) con Pin 3 TXD, y RC7/RX (Pin 26) con Pin 2 RXD.</text>
<text x="84" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• En FISICO (Modulo USB-TTL CP2102/CH340): los pines van CRUZADOS -> RC6/TX con RX del modulo, RC7/RX con TX del modulo, y GND con GND.</text>
<text x="84" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• Con com0com creas el par COM1 y COM2: Proteus usa COM1 y tu programa de Python (simulador_elevador.py) abre COM2 a 9600 baudios.</text>
</svg>