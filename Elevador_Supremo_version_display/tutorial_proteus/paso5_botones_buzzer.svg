<text x="67" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="bold" >Como funciona cada boton en Proteus y en Fisico</text>
<text x="69" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• BTN1 (SUBIR - RA4) y BTN2 (BAJAR - RA5): Se presionan ANTES de entrar al elevador para indicar direccion.</text>
<text x="69" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• BTN3 (ABRIR - RD6) y BTN4 (CERRAR - RD7): Se presionan DENTRO del elevador para abrir o cerrar la puerta.</text>
<text x="69" y="519" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• BTN5 (EMERGENCIA - RB4): Interrupcion inmediata -> congela los 3 elevadores, parpadean LEDs rojos y suena el BUZZER (RB5).</text>
<text x="69" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• Todos los botones entregan 1 (5V) sueltos y 0 (GND) al presionarlos. Pon etiquetas con el mismo nombre en U1.</text>
</svg>