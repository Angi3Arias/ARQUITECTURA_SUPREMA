<text x="67" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="bold" >Botones fisicos vs. Teclado 4x4 (Version Definitiva)</text>
<text x="69" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• Solo hay 2 botones fisicos: BTN1 (SUBIR - RA4) y BTN2 (BAJAR - RA5), con pull-up 10k a POWER y boton a GROUND.</text>
<text x="69" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• Ningun elevador se despacha hasta presionar SUBIR o BAJAR (despues de ingresar tu piso con 'A' + '#' en el teclado).</text>
<text x="69" y="519" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• Abrir puerta ('B'), Cerrar ('C'), Borrar ('D') y Paro de Emergencia ('*') se controlan desde el Teclado 4x4.</text>
<text x="69" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >• Al activar Emergencia ('*'), se congelan los 3 elevadores, parpadean los 3 LEDs rojos y suena el BUZZER 5V (RB5).</text>
