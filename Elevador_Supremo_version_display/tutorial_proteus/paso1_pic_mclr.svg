<text x="722" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="bold" >Checklist del Paso 1</text>
<text x="724" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >1. VDD y VSS del PIC18F4550 vienen ocultos</text>
<text x="724" y="477" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >   y conectados automaticamente en Proteus.</text>
<text x="724" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >2. Conecta Pin 1 (MCLR) -> R1 (10k) -> POWER.</text>
<text x="724" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >3. NO pongas cristal en pines 13 y 14.</text>
<text x="724" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="normal" >4. Doble clic en U1 y pon Clock = 8MHz.</text>
